services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      MONGODB_URI: mongodb://mongo:27017/resume_builder
      JWT_SECRET: local-dev-secret-change-me-please-64-characters-minimum-okay!!!!!
    depends_on:
      - mongo

volumes:
  mongo-data:
